<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>发布信息</title>
</head>
<body>

<h1>发布家教信息</h1>

<input id="name" placeholder="姓名">
<input id="subject" placeholder="科目">
<input id="contact" placeholder="联系方式">

<button onclick="post()">发布</button>

<h2>已发布信息</h2>
<div id="list"></div>

<script>
function post(){
    let data = JSON.parse(localStorage.getItem("posts") || "[]");

    data.push({
        name: document.getElementById("name").value,
        subject: document.getElementById("subject").value,
        contact: document.getElementById("contact").value
    });

    localStorage.setItem("posts", JSON.stringify(data));
    render();
}

function render(){
    let data = JSON.parse(localStorage.getItem("posts") || "[]");
    let html = "";

    data.forEach(item=>{
        html += `<p>${item.name}｜${item.subject}｜${item.contact}</p>`;
    });

    document.getElementById("list").innerHTML = html;
}

render();
</script>

</body>
</html>
