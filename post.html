<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>发布信息</title>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<h1>发布家教信息</h1>

<input id="name" placeholder="姓名">
<input id="subject" placeholder="科目">
<input id="contact" placeholder="联系方式">

<button onclick="post()">发布</button>

<h2>已发布信息</h2>
<div id="list"></div>

<script>
const supabase = supabase.createClient(
  "https://ircomtgwhaecyxwqheey.supabase.co",
  "sb_publishable_kcRMEnY_vsWngb9GNU-GiQ_oMcq-jeB"
);

async function post() {
    const name = document.getElementById("name").value;
    const subject = document.getElementById("subject").value;
    const contact = document.getElementById("contact").value;

    const { error } = await supabase
        .from('posts')
        .insert([
            {
                name,
                subject,
                contact
            }
        ]);

    if (!error) {
        document.getElementById("name").value = "";
        document.getElementById("subject").value = "";
        document.getElementById("contact").value = "";
        render();
    } else {
        console.log(error);
    }
}

async function render() {

    let { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

    let html = "";

    (data || []).forEach(item => {
        html += `<p>${item.name}｜${item.subject}｜${item.contact}</p>`;
    });

    document.getElementById("list").innerHTML = html;
}

render();
</script>

</body>
</html>
