<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家教平台 | 密码管理帖子</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *{box-sizing:border-box;}
        body{font-family:system-ui;max-width:1400px;margin:0 auto;padding:20px;background:#f0f2f5;}
        header{background:#2c3e66;color:white;text-align:center;padding:30px;border-radius:20px;margin-bottom:30px;}
        h1{margin:0;}
        .grid{display:flex;flex-wrap:wrap;gap:30px;}
        .col{flex:1;min-width:320px;}
        section{background:white;border-radius:20px;padding:24px;margin-bottom:30px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
        section h2{border-left:5px solid #4a90e2;padding-left:15px;margin-top:0;}
        .form-group{margin-bottom:16px;}
        label{font-weight:600;display:block;margin-bottom:6px;}
        input{width:100%;padding:10px;border:1px solid #ccc;border-radius:12px;}
        .btn{background:#4a90e2;color:white;border:none;padding:10px 20px;border-radius:30px;cursor:pointer;font-weight:bold;margin-right:8px;}
        .btn-small{background:#6c757d;padding:5px 12px;font-size:0.8rem;}
        .btn-danger{background:#d9534f;}
        .btn-warning{background:#f0ad4e;}
        .card{background:#fafcff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-top:16px;position:relative;}
        .card h3{margin:0 0 8px;}
        .card-actions{position:absolute;top:12px;right:12px;}
    </style>
</head>
<body>
<header>
    <h1>🎓 大学生 · 家教桥梁</h1>
    <p>发布信息时请务必记住【编辑密码】 | 修改/删除需输入密码</p>
</header>

<div class="grid">
    <!-- 左侧大学生 -->
    <div class="col">
        <section>
            <h2>✨ 发布家教信息</h2>
            <div class="form-group"><label>姓名</label><input type="text" id="tutor_name" placeholder="张明"></div>
            <div class="form-group"><label>性别</label><input type="text" id="tutor_gender" placeholder="男/女"></div>
            <div class="form-group"><label>年龄</label><input type="number" id="tutor_age" placeholder="20"></div>
            <div class="form-group"><label>学校</label><input type="text" id="tutor_school" placeholder="中国传媒大学"></div>
            <div class="form-group"><label>专业</label><input type="text" id="tutor_major" placeholder="汉语言文学"></div>
            <div class="form-group"><label>可授课科目</label><input type="text" id="tutor_subjects" placeholder="数学、英语"></div>
            <div class="form-group"><label>可授课时间</label><input type="text" id="tutor_time" placeholder="周末全天"></div>
            <div class="form-group"><label>期望薪资</label><input type="text" id="tutor_salary" placeholder="150元/小时"></div>
            <div class="form-group"><label>联系方式</label><input type="text" id="tutor_contact" placeholder="微信号"></div>
            <div class="form-group"><label>设置编辑密码（留空自动生成）</label><input type="text" id="tutor_key" placeholder="可选，留空则自动生成"></div>
            <button class="btn" id="tutorBtn">📢 发布家教信息</button>
        </section>
        <section><h2>📚 所有家教信息</h2><div id="tutorList">加载中...</div></section>
    </div>
    <!-- 右侧家长 -->
    <div class="col">
        <section>
            <h2>👪 发布家长需求</h2>
            <div class="form-group"><label>孩子年级</label><input type="text" id="parent_grade" placeholder="初二"></div>
            <div class="form-group"><label>辅导科目</label><input type="text" id="parent_subject" placeholder="数学"></div>
            <div class="form-group"><label>所在地区</label><input type="text" id="parent_district" placeholder="朝阳区/线上"></div>
            <div class="form-group"><label>预算(元/小时)</label><input type="text" id="parent_budget" placeholder="150"></div>
            <div class="form-group"><label>联系方式</label><input type="text" id="parent_contact" placeholder="微信号"></div>
            <div class="form-group"><label>设置编辑密码（留空自动生成）</label><input type="text" id="parent_key" placeholder="可选，留空则自动生成"></div>
            <button class="btn" id="parentBtn">📢 发布需求</button>
        </section>
        <section><h2>📌 所有家长需求</h2><div id="parentList">加载中...</div></section>
    </div>
</div>

<script>
    // ---------- 请修改成你的 Supabase 项目配置 ----------
    const MY_SUPABASE_URL = 'https://ftbfuvwvfeldriwzrfjq.supabase.co';   // 替换成你的
    const MY_SUPABASE_ANON_KEY = 'sb_publishable_pZb0TC_3QVvRHvmWalsdmg_gVzCVomq'; // 替换成你的
    // ---------- 不要修改下面代码，只改上面两行 ----------

    const sb = window.supabase.createClient(MY_SUPABASE_URL, MY_SUPABASE_ANON_KEY);

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
    }
    function generateRandomKey() {
        return Math.random().toString(36).substring(2, 10);
    }

    // 加载家教信息（不再显示密码）
    async function loadTutors() {
        const { data, error } = await sb.from('tutors').select('*').order('created_at', { ascending: false });
        const container = document.getElementById('tutorList');
        if (error) { container.innerHTML = '<p>加载失败</p>'; return; }
        if (!data || data.length === 0) { container.innerHTML = '<p>暂无数据</p>'; return; }
        let html = '';
        for (let t of data) {
            html += `
                <div class="card">
                    <div class="card-actions">
                        <button class="btn-small btn-warning" onclick="editTutor('${t.id}')">✏️编辑</button>
                        <button class="btn-small btn-danger" onclick="deleteTutor('${t.id}')">🗑️删除</button>
                    </div>
                    <h3>${escapeHtml(t.name)} | ${t.gender} | ${t.age}岁</h3>
                    <p>🏫 ${escapeHtml(t.school)} · ${escapeHtml(t.major)}</p>
                    <p>📚 可授科目：${escapeHtml(t.subjects)}</p>
                    <p>⏰ 时间：${escapeHtml(t.available_time)}</p>
                    <p>💰 薪资：${escapeHtml(t.expected_salary)}</p>
                    <p>📞 ${escapeHtml(t.contact)}</p>
                    <small>${new Date(t.created_at).toLocaleString()}</small>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // 加载家长需求（不再显示密码）
    async function loadParents() {
        const { data, error } = await sb.from('parent_requests').select('*').order('created_at', { ascending: false });
        const container = document.getElementById('parentList');
        if (error) { container.innerHTML = '<p>加载失败</p>'; return; }
        if (!data || data.length === 0) { container.innerHTML = '<p>暂无需求</p>'; return; }
        let html = '';
        for (let r of data) {
            html += `
                <div class="card">
                    <div class="card-actions">
                        <button class="btn-small btn-warning" onclick="editParent('${r.id}')">✏️编辑</button>
                        <button class="btn-small btn-danger" onclick="deleteParent('${r.id}')">🗑️删除</button>
                    </div>
                    <h3>📖 ${escapeHtml(r.child_grade)} · ${escapeHtml(r.subject)}</h3>
                    <p>📍 ${escapeHtml(r.district)} | 💰 ${escapeHtml(r.budget)}元/小时</p>
                    <p>📞 ${escapeHtml(r.contact)}</p>
                    <small>${new Date(r.created_at).toLocaleString()}</small>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    // 发布家教信息
    async function publishTutor() {
        const name = document.getElementById('tutor_name').value.trim();
        const gender = document.getElementById('tutor_gender').value.trim();
        const age = parseInt(document.getElementById('tutor_age').value);
        const school = document.getElementById('tutor_school').value.trim();
        const major = document.getElementById('tutor_major').value.trim();
        const subjects = document.getElementById('tutor_subjects').value.trim();
        const available_time = document.getElementById('tutor_time').value.trim();
        const expected_salary = document.getElementById('tutor_salary').value.trim();
        const contact = document.getElementById('tutor_contact').value.trim();
        let edit_key = document.getElementById('tutor_key').value.trim();
        if (!edit_key) edit_key = generateRandomKey();
        if (!name || !gender || isNaN(age) || !school || !major || !subjects || !available_time || !expected_salary || !contact) {
            alert('请完整填写所有大学生字段');
            return;
        }
        const { error } = await sb.from('tutors').insert([{ name, gender, age, school, major, subjects, available_time, expected_salary, contact, edit_key }]);
        if (error) { alert('发布失败: ' + error.message); console.error(error); }
        else {
            alert(`✅ 发布成功！请务必记住编辑密码：${edit_key}\n（建议截图保存，以后修改/删除时需要输入）`);
            document.getElementById('tutor_name').value = '';
            document.getElementById('tutor_gender').value = '';
            document.getElementById('tutor_age').value = '';
            document.getElementById('tutor_school').value = '';
            document.getElementById('tutor_major').value = '';
            document.getElementById('tutor_subjects').value = '';
            document.getElementById('tutor_time').value = '';
            document.getElementById('tutor_salary').value = '';
            document.getElementById('tutor_contact').value = '';
            document.getElementById('tutor_key').value = '';
            loadTutors();
        }
    }

    // 发布家长需求
    async function publishParent() {
        const child_grade = document.getElementById('parent_grade').value.trim();
        const subject = document.getElementById('parent_subject').value.trim();
        const district = document.getElementById('parent_district').value.trim();
        const budget = document.getElementById('parent_budget').value.trim();
        const contact = document.getElementById('parent_contact').value.trim();
        let edit_key = document.getElementById('parent_key').value.trim();
        if (!edit_key) edit_key = generateRandomKey();
        if (!child_grade || !subject || !district || !budget || !contact) {
            alert('请完整填写所有家长需求字段');
            return;
        }
        const { error } = await sb.from('parent_requests').insert([{ child_grade, subject, district, budget, contact, edit_key }]);
        if (error) { alert('发布失败: ' + error.message); }
        else {
            alert(`✅ 需求发布成功！请务必记住编辑密码：${edit_key}\n（建议截图保存，以后修改/删除时需要输入）`);
            document.getElementById('parent_grade').value = '';
            document.getElementById('parent_subject').value = '';
            document.getElementById('parent_district').value = '';
            document.getElementById('parent_budget').value = '';
            document.getElementById('parent_contact').value = '';
            document.getElementById('parent_key').value = '';
            loadParents();
        }
    }

    // 编辑/删除函数（需要密码验证）
    window.editTutor = async function(id) {
        const key = prompt('请输入该帖子的编辑密码：');
        if (!key) return;
        const { data, error } = await sb.from('tutors').select('*').eq('id', id).single();
        if (error || !data) { alert('获取信息失败'); return; }
        if (data.edit_key !== key) { alert('密码错误，无法编辑'); return; }
        const newName = prompt('修改姓名', data.name);
        if (newName === null) return;
        const newGender = prompt('修改性别', data.gender);
        const newAge = parseInt(prompt('修改年龄', data.age));
        const newSchool = prompt('修改学校', data.school);
        const newMajor = prompt('修改专业', data.major);
        const newSubjects = prompt('修改科目', data.subjects);
        const newTime = prompt('修改可授课时间', data.available_time);
        const newSalary = prompt('修改期望薪资', data.expected_salary);
        const newContact = prompt('修改联系方式', data.contact);
        const { error: updateError } = await sb.from('tutors').update({
            name: newName, gender: newGender, age: newAge, school: newSchool, major: newMajor,
            subjects: newSubjects, available_time: newTime, expected_salary: newSalary, contact: newContact
        }).eq('id', id);
        if (updateError) alert('更新失败: ' + updateError.message);
        else { alert('更新成功'); loadTutors(); }
    };

    window.deleteTutor = async function(id) {
        const key = prompt('请输入该帖子的编辑密码：');
        if (!key) return;
        const { data, error } = await sb.from('tutors').select('edit_key').eq('id', id).single();
        if (error) { alert('获取信息失败'); return; }
        if (data.edit_key !== key) { alert('密码错误，无法删除'); return; }
        if (!confirm('确定删除吗？')) return;
        const { error: delError } = await sb.from('tutors').delete().eq('id', id);
        if (delError) alert('删除失败: ' + delError.message);
        else { alert('删除成功'); loadTutors(); }
    };

    window.editParent = async function(id) {
        const key = prompt('请输入该需求的编辑密码：');
        if (!key) return;
        const { data, error } = await sb.from('parent_requests').select('*').eq('id', id).single();
        if (error || !data) { alert('获取信息失败'); return; }
        if (data.edit_key !== key) { alert('密码错误'); return; }
        const newGrade = prompt('修改年级', data.child_grade);
        const newSubject = prompt('修改科目', data.subject);
        const newDistrict = prompt('修改地区', data.district);
        const newBudget = prompt('修改预算', data.budget);
        const newContact = prompt('修改联系方式', data.contact);
        const { error: updateError } = await sb.from('parent_requests').update({
            child_grade: newGrade, subject: newSubject, district: newDistrict, budget: newBudget, contact: newContact
        }).eq('id', id);
        if (updateError) alert('更新失败');
        else { alert('更新成功'); loadParents(); }
    };

    window.deleteParent = async function(id) {
        const key = prompt('请输入该需求的编辑密码：');
        if (!key) return;
        const { data, error } = await sb.from('parent_requests').select('edit_key').eq('id', id).single();
        if (error) { alert('获取信息失败'); return; }
        if (data.edit_key !== key) { alert('密码错误'); return; }
        if (!confirm('确定删除吗？')) return;
        const { error: delError } = await sb.from('parent_requests').delete().eq('id', id);
        if (delError) alert('删除失败');
        else { alert('删除成功'); loadParents(); }
    };

    document.getElementById('tutorBtn').onclick = publishTutor;
    document.getElementById('parentBtn').onclick = publishParent;

    loadTutors();
    loadParents();
</script>
</body>
</html>
